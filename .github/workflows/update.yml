name: Обновление расписания

# Каждые полчаса скачиваем таблицы из облака колледжа, разбираем их и коммитим
# docs/data/schedule.json. GitHub Pages раздаёт этот файл, сервер не нужен.
on:
  schedule:
    # В 20 и 50 минут каждого часа. На бесплатном тарифе GitHub часть запусков
    # по расписанию просто пропускает — наблюдалось раз в 2,5–3,5 часа вместо
    # часа. Двумя попытками в час перекрываем пропуски. Ровные :00 и :30 не
    # берём намеренно: в эти минуты очередь GitHub самая длинная, и запуск
    # с большей вероятностью отложат.
    - cron: "20,50 * * * *"
  workflow_dispatch:        # кнопка «Run workflow» для обновления вручную

permissions:
  contents: write           # нужно, чтобы коммитить обновлённый файл

concurrency:
  group: schedule-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install openpyxl

      - name: Собрать расписание
        run: python tools/build_data.py

      - name: Закоммитить расписание
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/schedule.json
          # Файл отличается от прошлого при каждом запуске: в нём записано
          # время, когда сборка ходила в облако. Проверка оставлена только
          # как страховка — без неё git commit уронил бы запуск, если
          # менять и правда нечего.
          if git diff --cached --quiet -- docs/data/schedule.json; then
            echo "Файл не изменился — коммитить нечего."
            exit 0
          fi
          git commit -m "Обновление расписания $(date -u '+%d.%m.%Y %H:%M UTC')"
          git push
